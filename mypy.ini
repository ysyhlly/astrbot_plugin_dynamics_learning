[mypy]
python_version = 3.10
# Core modules are pure, host-independent and fully annotated; start there.
files = core/config.py, core/trace.py, core/features.py, core/scope.py, core/quality.py, core/review.py, core/reply_review.py, core/scope_profile.py, core/window.py, core/samples.py, core/metrics.py, core/policy.py, core/logistic.py, core/recommendation.py, core/candidates.py, core/autotune.py, core/evaluator.py, core/topic_learner.py, core/recipient_learner.py, core/report.py, core/ingest.py
follow_imports = silent
check_untyped_defs = True
disallow_untyped_defs = True
warn_return_any = True
warn_unused_ignores = True
show_error_codes = True
