name: CI

on:
  push:
    branches: [main, master, "release/**"]
  pull_request:
    branches: [main, master, "release/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout AstrBot
        uses: actions/checkout@v5
        with:
          repository: AstrBotDevs/AstrBot
          ref: v4.29.4
          path: AstrBot

      - name: Checkout plugin
        uses: actions/checkout@v5
        with:
          path: AstrBot/data/plugins/${{ github.event.repository.name }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            AstrBot/requirements.txt
            AstrBot/data/plugins/${{ github.event.repository.name }}/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r AstrBot/requirements.txt
          plugin_dir="AstrBot/data/plugins/${{ github.event.repository.name }}"
          if [ -f "$plugin_dir/requirements.txt" ]; then
            python -m pip install -r "$plugin_dir/requirements.txt"
          fi
          if [ -f "$plugin_dir/requirements-dev.txt" ]; then
            python -m pip install -r "$plugin_dir/requirements-dev.txt"
          fi
          python -m pip install ruff pytest pytest-asyncio pyyaml

      - name: Ruff check
        working-directory: AstrBot/data/plugins/${{ github.event.repository.name }}
        run: python -m ruff check .

      - name: Run unit tests
        working-directory: AstrBot/data/plugins/${{ github.event.repository.name }}
        env:
          ASTRBOT_ROOT: ${{ runner.temp }}/astrbot-ci
          PYTHONPATH: ${{ github.workspace }}/AstrBot/data/plugins:${{ github.workspace }}/AstrBot
        run: |
          mkdir -p "$ASTRBOT_ROOT"
          python -m pytest tests -q --ignore-glob="*browser*"
